
services:
  # ── PostgreSQL + PostGIS (optional; only needed when DB_MODE=postgres) ──
  db:
    image: postgis/postgis:16-3.4
    container_name: nagarnetra_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nagarnetra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nagarnetra_pass}
      POSTGRES_DB: ${POSTGRES_DB:-nagarnetra}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nagarnetra"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - postgres

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagarnetra_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_MODE=${DB_MODE:-sqlite}
      - SQLITE_PATH=/app/data/nagarnetra.db
      - CAMERAS_JSON_PATH=/app/data/cameras.json
      - BLACKLIST_JSON_PATH=/app/data/blacklist.json
      - VIDEOS_DIR=/app/data/sample_videos
      - YOLO_WEIGHTS_PATH=/app/models/best.pt
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
        required: false

  # ── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagarnetra_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
      - VITE_WS_URL=ws://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  pg_data:
