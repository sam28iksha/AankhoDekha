services:
  # ── PostgreSQL + PostGIS (optional; only needed when DB_MODE=postgres) ──
  db:
    image: postgis/postgis:16-3.4
    container_name: aankhodekha_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aankhodekha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aankhodekha_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aankhodekha}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Maps our setup script to auto-run on first boot
      - ./backend/db/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
     # Dynamically uses the variables so it doesn't break if you change usernames
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aankhodekha} -d $${POSTGRES_DB:-aankhodekha}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aankhodekha_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_MODE=${DB_MODE:-postgres}  # Switched to Postgres
      - SQLITE_PATH=/app/data/aankhodekha.db
      - CAMERAS_JSON_PATH=/app/data/cameras.json
      - BLACKLIST_JSON_PATH=/app/data/blacklist.json
      - VIDEOS_DIR=/app/data/sample_videos
      - YOLO_WEIGHTS_PATH=/app/models/best.pt
      - PYTHONPATH=/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy

  # ── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aankhodekha_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
      - VITE_WS_URL=ws://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  pg_data:
